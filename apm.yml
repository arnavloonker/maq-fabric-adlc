name: maq-fabric-engineering
version: 0.1.0
description: MAQ workflow and Fabric engineering expertise
targets:
  - copilot
includes: auto
dependencies:
  apm:
    - microsoft/fabric-skills
  # registry: false marks self-defined servers, skipping registry lookup.
  # Fabric servers are re-declared from microsoft/fabric-skills so they are
  # trusted as direct dependencies without --trust-transitive-mcp.
  mcp:
    - name: azure-devops
      registry: false
      transport: stdio
      command: npx
      args:
        - "-y"
        - "@azure-devops/mcp"
        - "${AZURE_DEVOPS_ORG}"
    - name: FabricIQ
      registry: false
      transport: http
      url: https://fabriciq.svc.cloud.microsoft/v1/mcp/fabriciq
      headers:
        X-VARIANTS: "Fabric.Routing.FabricIQ.V1"
      tools:
        - "*"
    - name: fabric-sqlendpoint
      registry: false
      transport: http
      url: https://api.fabric.microsoft.com/v1/mcp/dataPlane/sqlEndpoint
      tools:
        - "execute_query"
scripts: {}
